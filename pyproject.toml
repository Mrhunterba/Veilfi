[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "veilfi"
version = "0.1.0"
description = "Protecting indoor privacy from WiFi motion sensing using a reconfigurable reflecting surface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
hardware = ["pyserial>=3.5", "scapy>=2.5"]
deep = ["torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
