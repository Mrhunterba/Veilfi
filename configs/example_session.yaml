# One recording session = one combination of the factors below (paper Sec. V-B).
session_id: S001
date: 2026-11-20
participant_code: P01           # codes only, never names

network:
  channel: null                 # set after the RIS channel characterization (Sec. IV-A)
  bandwidth_mhz: 80
  traffic_load: idle            # idle | browsing | video | bulk

shield:
  setting: veilfi_free_running  # static | hold_based | veilfi_free_running | veilfi_packet_triggered
  rotating_reflector: false
  ris_distance_cm: 30           # 15-150
  controller_limit_hz: null     # measured value, see scripts/measure_controller_limit.py

eavesdropper:
  position: E1                  # marked positions outside the protected area
  device: rpi4-nexmon

conditions:                     # block order is randomized per session
  - empty
  - stationary
  - walking
  - arm_motion
block_duration_s: 60

seeds:
  analysis: 0                   # analysis seed only; the RIS sequence is never seeded
